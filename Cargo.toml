[package]
name = "cgbl"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Global gates, uniqueness, suspension and blind passport issuance for cvld"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-libs/cgbl"
readme = "README.md"
publish = false
include = ["Cargo.toml", "build.rs", "src/**", "docs/**", "README.md", "LICENSE.md"]

[features]
default = []
development-gate = []

[dependencies]
cphn = { git = "https://git.corbet.ch/corbet-foss/cphn", branch = "main" }
cmbx = { git = "https://git.corbet.ch/corbet-foss/cmbx", branch = "main" }
cpmt = { git = "https://git.corbet.ch/corbet-foss/cpmt", branch = "main" }
cbcn = { git = "https://git.corbet.ch/corbet-foss/cbcn", branch = "main" }
ckyh = { git = "https://git.corbet.ch/corbet-foss/ckyh", branch = "main", features = ["certificate-signing"] }
cplc = { git = "https://git.corbet.ch/corbet-libs/cplc", branch = "main" }
crbk = { git = "https://git.corbet.ch/corbet-foss/crbk", branch = "main" }
cshm = { git = "https://git.corbet.ch/corbet-foss/cshm", branch = "main" }
cpsd = { git = "https://git.corbet.ch/corbet-foss/cpsd", branch = "main", default-features = false, features = ["storage"] }
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt", branch = "main" }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", features = ["libsql"] }
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
zeroize = "1.9"

[dev-dependencies]
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", features = ["volatile-signer"] }
cchr = { git = "https://git.corbet.ch/corbet-foss/cchr", branch = "v01" }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }
cfbk = { git = "https://git.corbet.ch/corbet-foss/cfbk", branch = "main" }
http = "1"
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
rand = { version = "0.8", features = ["std_rng"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
