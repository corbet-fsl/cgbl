[package]
name = "cgbl"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Global gates, uniqueness, permanent blocks and blind passport issuance for cvld"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-fsl/cgbl.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "build.rs", "src/**", "docs/**", "README.md", "LICENSE.md"]

[features]
default = []
development-gate = []

[dependencies]
cphn = { git = "https://git.corbet.ch/corbet-libre/cphn.git", branch = "main" }
cmbx = { git = "https://git.corbet.ch/corbet-libre/cmbx.git", branch = "main" }
cpmt = { git = "https://git.corbet.ch/corbet-libre/cpmt.git", branch = "main" }
cbcn = { git = "https://git.corbet.ch/corbet-libre/cbcn.git", branch = "main" }
cchr = { git = "https://git.corbet.ch/corbet-libre/cchr.git", branch = "main" }
ckmg = { git = "https://git.corbet.ch/corbet-libre/ckmg.git", branch = "main" }
ckyh = { git = "https://git.corbet.ch/corbet-libre/ckyh.git", branch = "main", features = ["certificate-signing"] }
cplc = { git = "https://git.corbet.ch/corbet-fsl/cplc.git", branch = "main" }
crbk = { git = "https://git.corbet.ch/corbet-libre/crbk.git", branch = "main" }
cshm = { git = "https://git.corbet.ch/corbet-libre/cshm.git", branch = "main" }
cpsd = { git = "https://git.corbet.ch/corbet-libre/cpsd.git", branch = "main", default-features = false, features = ["storage"] }
crlt = { git = "https://git.corbet.ch/corbet-libre/crlt.git", branch = "main" }
csgn = { git = "https://git.corbet.ch/corbet-libre/csgn.git", branch = "main", features = ["libsql"] }
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
zeroize = "1.9"

[dev-dependencies]
blake3 = "1"
csgn = { git = "https://git.corbet.ch/corbet-libre/csgn.git", branch = "main", features = ["volatile-signer"] }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }
cfbk = { git = "https://git.corbet.ch/corbet-libre/cfbk.git", branch = "main" }
http = "1"
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
rand = { version = "0.8", features = ["std_rng"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

